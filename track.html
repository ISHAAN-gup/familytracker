<!DOCTYPE html>

<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Family Tracker Pro</title>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    body{
      margin:0;
      font-family:Arial,Helvetica,sans-serif;
      background:#f4f4f4;
      color:#111;
      transition:background .25s,color .25s;
    }

    body.dark{
      background:#121212;
      color:#f1f1f1;
    }

    .top{
      padding:12px;
      background:#fff;
      box-shadow:0 2px 8px rgba(0,0,0,.12);
      display:flex;
      flex-wrap:wrap;
      gap:10px;
      align-items:center;
    }

    body.dark .top{
      background:#1f1f1f;
    }

    select,input,button{
      padding:10px;
      border-radius:8px;
      border:1px solid #ccc;
      font-size:14px;
    }

    button{
      cursor:pointer;
    }

    #map{
      height:60vh;
      width:100%;
    }

    .panel{
      background:#fff;
      padding:15px;
    }

    body.dark .panel{
      background:#1b1b1b;
    }

    .stat{
      margin:8px 0;
      font-size:15px;
    }

    .online{color:#16a34a;font-weight:bold;}
    .offline{color:#dc2626;font-weight:bold;}
  </style>

</head>
<body>

<div class="top">
  <strong>Track:</strong>

  <input id="search" placeholder="Search user" oninput="filterUsers()">

  <select id="userSelect" onchange="startTracking()">
    <option value="">Loading...</option>
  </select>

<button onclick="showAllUsers()">Show All</button> <button id="followBtn" onclick="toggleFollow()">Unpin / Stop Following</button> <button onclick="toggleDarkMode()">Dark Mode</button>

</div>

<div id="map"></div>

<div id="sosPopup" style="display:none;position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#dc2626;color:white;padding:18px 22px;border-radius:12px;font-size:18px;font-weight:bold;z-index:9999;box-shadow:0 6px 20px rgba(0,0,0,.3);">
  EMERGENCY SOS
</div>

<div class="panel">
  <h3 id="personTitle">No user selected</h3>

  <div class="stat">Status: <span id="statusText">--</span></div>
  <div class="stat">Speed: <span id="speedText">--</span></div>
  <div class="stat">Movement: <span id="movementText">--</span></div>
  <div class="stat">Updated: <span id="updatedText">--</span></div>
  <div class="stat">Distance from you: <span id="distanceText">--</span></div>
  <div class="stat">ETA: <span id="etaText">--</span></div>
</div>

<div class="panel" style="margin-top:10px;">
  <h3>Family Messages</h3>
  <div id="messages" style="height:160px;overflow:auto;border:1px solid #ccc;padding:10px;border-radius:8px;background:#fafafa;"></div>
  <div style="display:flex;gap:8px;margin-top:10px;">
    <input id="messageInput" placeholder="Type a message..." style="flex:1;">
    <button onclick="sendMessage()">Send</button>
  </div>
</div>

<script>
const firebaseConfig={
  apiKey:"AIzaSyBEPmpn9UCgLknRnMnPRPaLLQpYgCPgqME",
  authDomain:"familytracker01-b1b1a.firebaseapp.com",
  databaseURL:"https://familytracker01-b1b1a-default-rtdb.firebaseio.com",
  projectId:"familytracker01-b1b1a",
  storageBucket:"familytracker01-b1b1a.firebasestorage.app",
  messagingSenderId:"87073205371",
  appId:"1:87073205371:web:b1cba078d73e843afac6de"
};

firebase.initializeApp(firebaseConfig);
const db=firebase.database();

const map=L.map("map").setView([20,78],5);

const normal=L.tileLayer(
  "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
  {attribution:"&copy; OpenStreetMap contributors"}
);

const satellite=L.tileLayer(
  "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
  {attribution:"Tiles &copy; Esri"}
);

const terrain=L.tileLayer(
  "https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png",
  {attribution:"&copy; OpenTopoMap"}
);

normal.addTo(map);

L.control.layers(
  {"Current":normal,"Satellite":satellite,"Terrain":terrain},
  {}
).addTo(map);

// Follow / Pin behavior
let followMode = true;
let followZoom = 16;

map.on("zoomend", () => {
  followZoom = map.getZoom();
});

map.on("dragstart", () => {
  if (followMode) {
    followMode = false;
    document.getElementById("followBtn").innerText = "Pin / Follow";
  }
});

const colors=["red","blue","green","orange","purple","black"];

function coloredIcon(color){
  return new L.Icon({
    iconUrl:`https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-${color}.png`,
    shadowUrl:"https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.7.1/images/marker-shadow.png",
    iconSize:[25,41],
    iconAnchor:[12,41],
    popupAnchor:[1,-34],
    shadowSize:[41,41]
  });
}

let markers={};
let currentRef=null;
let currentData=null;
let userLocation=null;
let currentTrackedUser="";

if(localStorage.getItem("darkMode")==="true"){
  document.body.classList.add("dark");
}

if(navigator.geolocation){
  navigator.geolocation.getCurrentPosition(p=>{
    userLocation=[p.coords.latitude,p.coords.longitude];
  });
}

db.ref("users").on("value",snap=>{
  const users=snap.val()||{};
  const select=document.getElementById("userSelect");

  const previous=select.value;

  select.innerHTML="";

  for(const name in users){
    const opt=document.createElement("option");
    opt.value=name;
    opt.textContent=name;
    select.appendChild(opt);
  }

  if(previous && users[previous]){
    select.value=previous;
  }else if(select.options.length>0){
    select.selectedIndex=0;
  }

  updateAllMarkers(users);

  if(select.options.length>0){
    startTracking();
  }else{
    document.getElementById("personTitle").innerText="No user selected";
    document.getElementById("statusText").innerText="--";
  }
});

function updateAllMarkers(users){
  for(const key in markers){
    if(!users[key]){
      map.removeLayer(markers[key]);
      delete markers[key];
    }
  }

  let i=0;

  for(const name in users){
    const d=users[name];

    if(!markers[name]){
      markers[name]=L.marker([d.lat,d.lng],{
        icon:coloredIcon(colors[i%colors.length])
      }).addTo(map).bindPopup(name);
    }else{
      markers[name].setLatLng([d.lat,d.lng]);
    }

    i++;
  }
}

function showAllUsers(){
  const bounds=[];

  for(const name in markers){
    bounds.push(markers[name].getLatLng());
  }

  if(bounds.length){
    map.fitBounds(bounds,{padding:[50,50]});
  }
}

function startTracking(){
  const name=document.getElementById("userSelect").value;

  if(!name)return;

  document.getElementById("personTitle").innerText=name;
  currentTrackedUser = name;
  listenForSOS(name);
  listenForMessages(name);

  if(currentRef){
    currentRef.off();
  }

  currentRef=db.ref("users/"+name);

  currentRef.on("value",snap=>{
    const data=snap.val();

    if(!data){
      document.getElementById("statusText").innerHTML="<span class='offline'>Offline</span>";
      return;
    }

    currentData=data;

    if(markers[name]){
      markers[name].setLatLng([data.lat,data.lng]);
    }

    if(followMode){
      map.setView([data.lat,data.lng], followZoom, {
        animate:true,
        duration:0.6
      });
    }

    updateInfo(data);
  });
}

function updateInfo(data){
  const now=Date.now();
  const diff=Math.floor((now-data.time)/1000);

  document.getElementById("statusText").innerHTML=
    diff<=30
      ? "<span class='online'>Online</span>"
      : "<span class='offline'>Offline</span>";

  document.getElementById("updatedText").innerText=diff+" sec ago";

  const speed=data.speed||0;
  document.getElementById("speedText").innerText=speed.toFixed(1)+" km/h";

  document.getElementById("movementText").innerText=
    speed>1?"Moving":"Stopped";

  if(userLocation){
    const d=haversine(
      userLocation[0],userLocation[1],
      data.lat,data.lng
    );

    document.getElementById("distanceText").innerText=
      d.toFixed(2)+" km";

    if(speed>1){
      const eta=(d/speed)*60;
      document.getElementById("etaText").innerText=
        eta.toFixed(0)+" min";
    }else{
      document.getElementById("etaText").innerText="--";
    }
  }else{
    document.getElementById("distanceText").innerText=
      "Allow location permission";
    document.getElementById("etaText").innerText="--";
  }
}

setInterval(()=>{
  if(currentData){
    updateInfo(currentData);
  }
},1000);

function haversine(lat1,lon1,lat2,lon2){
  const R=6371;
  const dLat=(lat2-lat1)*Math.PI/180;
  const dLon=(lon2-lon1)*Math.PI/180;

  const a=
    Math.sin(dLat/2)**2+
    Math.cos(lat1*Math.PI/180)*
    Math.cos(lat2*Math.PI/180)*
    Math.sin(dLon/2)**2;

  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}

function filterUsers(){
  const q=document.getElementById("search").value.toLowerCase();
  const select=document.getElementById("userSelect");

  Array.from(select.options).forEach(o=>{
    o.style.display=
      o.text.toLowerCase().includes(q)?"":"none";
  });
}

function toggleFollow(){
  followMode = !followMode;

  const btn = document.getElementById("followBtn");

  if(followMode){
    btn.innerText = "Unpin / Stop Following";

    if(currentData){
      map.setView([currentData.lat, currentData.lng], followZoom, {
        animate:true,
        duration:0.8
      });
    }
  }else{
    btn.innerText = "Pin / Follow";
  }
}



function listenForSOS(name){
  db.ref("sos/"+name).on("value", snap => {
    const data = snap.val();
    if(!data || !data.active) return;

    const popup = document.getElementById("sosPopup");
    popup.innerText = "EMERGENCY: " + name + " pressed SOS!";
    popup.style.display = "block";

    if(markers[name]){
      const pos = markers[name].getLatLng();
      map.setView(pos, 17, {animate:true, duration:1});
    }

    try{
      const audio = new (window.AudioContext || window.webkitAudioContext)();
      const osc = audio.createOscillator();
      const gain = audio.createGain();
      osc.type = "square";
      osc.frequency.value = 880;
      osc.connect(gain);
      gain.connect(audio.destination);
      osc.start();
      gain.gain.setValueAtTime(0.2, audio.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audio.currentTime + 0.8);
      osc.stop(audio.currentTime + 0.8);
    }catch(e){}

    setTimeout(()=>{
      popup.style.display = "none";
      db.ref("sos/"+name).remove();
    }, 8000);
  });
}

function sendMessage(){
  if(!currentTrackedUser) return;
  const text = document.getElementById("messageInput").value.trim();
  if(!text) return;
  db.ref("messages/"+currentTrackedUser).push({
    from:"Family",
    text:text,
    time:Date.now()
  });
  document.getElementById("messageInput").value="";
}

function listenForMessages(name){
  const box = document.getElementById("messages");
  box.innerHTML = "";
  db.ref("messages/"+name).off();
  db.ref("messages/"+name).on("child_added", snap => {
    const m = snap.val();
    const div = document.createElement("div");
    div.style.padding = "6px 0";
    div.innerHTML = "<b>" + (m.from || "Unknown") + ":</b> " + m.text;
    box.appendChild(div);
    box.scrollTop = box.scrollHeight;
  });
}

function toggleDarkMode(){
  document.body.classList.toggle("dark");
  localStorage.setItem(
    "darkMode",
    document.body.classList.contains("dark")
  );
}
</script>

</body>
</html>
