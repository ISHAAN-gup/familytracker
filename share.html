<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Family Tracker Share</title>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

  <style>
    :root{
      --bg:#f2f2f2;
      --card:#ffffff;
      --text:#111827;
      --muted:#6b7280;
      --primary:#2563eb;
      --danger:#dc2626;
      --border:#e5e7eb;
      --shadow:0 8px 24px rgba(0,0,0,.08);
    }

    body{
      font-family:Arial,Helvetica,sans-serif;
      background:var(--bg);
      color:var(--text);
      margin:0;
      padding:24px;
      transition:background .25s,color .25s;
    }

    body.dark{
      --bg:#0f172a;
      --card:#111827;
      --text:#f9fafb;
      --muted:#9ca3af;
      --primary:#3b82f6;
      --danger:#ef4444;
      --border:#1f2937;
      --shadow:0 8px 24px rgba(0,0,0,.35);
    }

    .box{
      background:var(--card);
      padding:24px;
      border-radius:16px;
      max-width:420px;
      margin:0 auto;
      box-shadow:var(--shadow);
      border:1px solid var(--border);
    }

    .profile{
      width:64px;
      height:64px;
      border-radius:50%;
      background:#2563eb;
      color:#fff;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:28px;
      font-weight:700;
      margin:0 auto 12px;
    }

    h2{
      margin:6px 0 18px;
      text-align:center;
    }

    input,select{
      width:100%;
      padding:12px;
      font-size:16px;
      margin:8px 0;
      border:1px solid var(--border);
      border-radius:10px;
      background:var(--card);
      color:var(--text);
      box-sizing:border-box;
    }

    .row{
      display:flex;
      gap:10px;
      margin-top:10px;
    }

    button{
      flex:1;
      padding:12px;
      font-size:16px;
      border:none;
      border-radius:10px;
      cursor:pointer;
      color:#fff;
      background:var(--primary);
    }

    .stop{background:var(--danger);}
    .secondary{background:#475569;}

    .status-row{
      display:flex;
      align-items:center;
      justify-content:center;
      gap:10px;
      margin:16px 0 8px;
      font-weight:700;
    }

    .dot{
      width:14px;
      height:14px;
      border-radius:50%;
      background:#dc2626;
      box-shadow:0 0 0 4px rgba(220,38,38,.15);
    }

    .dot.on{
      background:#16a34a;
      box-shadow:0 0 0 4px rgba(22,163,74,.15);
    }

    .stats{
      margin-top:16px;
      border:1px solid var(--border);
      border-radius:12px;
      padding:14px;
      background:rgba(255,255,255,.02);
    }

    .stat{
      display:flex;
      justify-content:space-between;
      padding:8px 0;
      border-bottom:1px solid var(--border);
      font-size:15px;
    }

    .stat:last-child{
      border-bottom:none;
    }

    #status{
      margin-top:14px;
      text-align:center;
      color:var(--muted);
      font-weight:600;
    }

    .hint{
      font-size:13px;
      color:var(--muted);
      text-align:center;
      margin-top:10px;
    }
  </style>
</head>
<body>

<div id="msgPopup" style="display:none;position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#2563eb;color:white;padding:16px 20px;border-radius:12px;font-size:18px;font-weight:bold;z-index:9999;box-shadow:0 6px 20px rgba(0,0,0,.3);"></div>

<div class="box">
  <div class="profile" id="profileIcon">I</div>
  <h2>Share Live Location</h2>

  <input type="text" id="name" placeholder="Enter your name (Ishaan, Dad, Mom)">
  <input type="password" id="familyCode" placeholder="Enter family code">

  <select id="interval">
    <option value="1000">Update every 1 sec</option>
    <option value="2000" selected>Update every 2 sec</option>
    <option value="5000">Update every 5 sec</option>
    <option value="10000">Update every 10 sec</option>
  </select>

  <div class="row">
    <button onclick="startSharing()">Start Sharing</button>
    <button class="stop" onclick="stopSharing()">Stop Sharing</button>
  </div>

  <div class="row">
    <button class="secondary" onclick="toggleDarkMode()">Dark Mode</button>
    <button class="secondary" onclick="sendSOS()">SOS</button>
  </div>

  <div class="status-row">
    <div class="dot" id="indicator"></div>
    <span id="shareState">Stopped</span>
  </div>

  <div class="stats">
    <div class="stat"><span>Battery</span><strong id="batteryText">--</strong></div>
    <div class="stat"><span>GPS accuracy</span><strong id="accuracyText">--</strong></div>
    <div class="stat"><span>Speed</span><strong id="speedText">--</strong></div>
    <div class="stat"><span>Activity</span><strong id="activityText">--</strong></div>
  </div>


  <div class="stats" style="margin-top:16px;">
    <div style="font-weight:700;margin-bottom:8px;">Messages from Family</div>
    <div id="messages" style="height:140px;overflow:auto;border:1px solid var(--border);padding:10px;border-radius:8px;background:rgba(255,255,255,.03);"></div>
    <div style="display:flex;gap:8px;margin-top:10px;">
      <input id="messageInput" placeholder="Reply to family..." style="flex:1;">
      <button onclick="replyToFamily()">Reply</button>
    </div>
  </div>

  <div id="status">Location sharing is stopped.</div>
  <div class="hint">Keep this page open while sharing. The app remembers your name for next time.</div>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyBEPmpn9UCgLknRnMnPRPaLLQpYgCPgqME",
  authDomain: "familytracker01-b1b1a.firebaseapp.com",
  databaseURL: "https://familytracker01-b1b1a-default-rtdb.firebaseio.com",
  projectId: "familytracker01-b1b1a",
  storageBucket: "familytracker01-b1b1a.firebasestorage.app",
  messagingSenderId: "87073205371",
  appId: "1:87073205371:web:b1cba078d73e843afac6de"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

const FAMILY_CODE = "1234";

let watchId = null;
let currentUser = "";
let batteryLevel = null;
let isSharing = false;
let tripRecording = false;
let routePoints = [];
let lastSent = 0;

const indicator = document.getElementById("indicator");
const shareState = document.getElementById("shareState");

const savedName = localStorage.getItem("familyTrackerName");
if (savedName) {
  document.getElementById("name").value = savedName;
  updateProfileIcon(savedName);
}

document.getElementById("name").addEventListener("input", e => {
  updateProfileIcon(e.target.value);
});

if ("getBattery" in navigator) {
  navigator.getBattery().then(b => {
    batteryLevel = Math.round(b.level * 100);
    updateBatteryText();
    b.addEventListener("levelchange", () => {
      batteryLevel = Math.round(b.level * 100);
      updateBatteryText();
    });
  });
}

function updateBatteryText() {
  document.getElementById("batteryText").innerText =
    batteryLevel === null ? "--" : batteryLevel + "%";
}

function updateProfileIcon(name) {
  const t = (name || "?").trim();
  document.getElementById("profileIcon").innerText = t ? t.charAt(0).toUpperCase() : "?";
}

function setSharingState(on) {
  isSharing = on;
  indicator.classList.toggle("on", on);
  shareState.innerText = on ? "Sharing" : "Stopped";
}

function vibrate(ms) {
  if (navigator.vibrate) navigator.vibrate(ms);
}

function toggleDarkMode() {
  document.body.classList.toggle("dark");
  localStorage.setItem("familyTrackerDark", document.body.classList.contains("dark") ? "1" : "0");
}

if (localStorage.getItem("familyTrackerDark") === "1") {
  document.body.classList.add("dark");
}

function activityFromSpeed(speed) {
  if (speed < 1) return "Stopped";
  if (speed < 7) return "Walking";
  if (speed < 20) return "Cycling";
  return "Driving";
}

function startSharing() {
  const name = document.getElementById("name").value.trim();
  const code = document.getElementById("familyCode").value.trim();

  if (!name) {
    alert("Please enter your name");
    return;
  }

  if (code !== FAMILY_CODE) {
    alert("Invalid family code");
    return;
  }

  currentUser = name;
  localStorage.setItem("familyTrackerName", name);
  listenForMessages(name);

  if (watchId !== null) {
    navigator.geolocation.clearWatch(watchId);
  }

  const interval = parseInt(document.getElementById("interval").value, 10);

  setSharingState(true);
  vibrate(120);
  document.getElementById("status").innerText = "Requesting location permission...";

  watchId = navigator.geolocation.watchPosition(
    pos => {
      const now = Date.now();
      if (now - lastSent < interval) return;
      lastSent = now;

      const speed = (pos.coords.speed || 0) * 3.6;
      const accuracy = Math.round(pos.coords.accuracy || 0);
      const activity = activityFromSpeed(speed);

      document.getElementById("accuracyText").innerText = accuracy + " m";
      document.getElementById("speedText").innerText = speed.toFixed(1) + " km/h";
      document.getElementById("activityText").innerText = activity;

      const payload = {
        lat: pos.coords.latitude,
        lng: pos.coords.longitude,
        accuracy,
        speed,
        activity,
        battery: batteryLevel,
        time: now,
        online: true
      };

      db.ref("users/" + name).set(payload);

      if (tripRecording) {
        routePoints.push({ lat: payload.lat, lng: payload.lng, time: now });
      }

      document.getElementById("status").innerText = "Sharing live location as " + name;
    },
    err => {
      document.getElementById("status").innerText = "Location error: " + err.message;
      setSharingState(false);
    },
    {
      enableHighAccuracy: true,
      maximumAge: 0,
      timeout: 5000
    }
  );
}

function stopSharing() {
  if (watchId !== null) {
    navigator.geolocation.clearWatch(watchId);
    watchId = null;
  }

  if (currentUser) {
    db.ref("users/" + currentUser).remove();
  }

  setSharingState(false);
  vibrate([120, 80, 120]);
  document.getElementById("status").innerText = "Location sharing stopped.";
}

function sendSOS() {
  if (!currentUser) {
    alert("Start sharing first.");
    return;
  }

  db.ref("sos/" + currentUser).set({
    active: true,
    time: Date.now()
  });

  vibrate([200,100,200]);
  alert("SOS sent to family!");
}

function startTrip() {
  tripRecording = true;
  routePoints = [];
}

function stopTrip() {
  tripRecording = false;
  if (!currentUser || routePoints.length === 0) return;

  db.ref("trips/" + currentUser + "/" + Date.now()).set(routePoints);
}


function listenForMessages(name) {
  const box = document.getElementById("messages");
  box.innerHTML = "";
  db.ref("messages/" + name).off();
  db.ref("messages/" + name).on("child_added", snap => {
    const m = snap.val();
    const div = document.createElement("div");
    div.style.padding = "6px 0";
    div.innerHTML = "<b>" + (m.from || "Family") + ":</b> " + m.text;
    box.appendChild(div);
    box.scrollTop = box.scrollHeight;

    const popup = document.getElementById("msgPopup");
    popup.innerText = (m.from || "Family") + ": " + m.text;
    popup.style.display = "block";
    if (navigator.vibrate) navigator.vibrate([120,60,120]);
    setTimeout(() => popup.style.display = "none", 5000);
  });
}

function replyToFamily() {
  if (!currentUser) {
    alert("Start sharing first.");
    return;
  }
  const input = document.getElementById("messageInput");
  const text = input.value.trim();
  if (!text) return;
  db.ref("messages/" + currentUser).push({
    from: currentUser,
    text: text,
    time: Date.now()
  });
  input.value = "";
}


window.addEventListener("beforeunload", () => {
  if (isSharing && currentUser) {
    db.ref("users/" + currentUser + "/online").set(false);
  }
});
</script>

</body>
</html>
